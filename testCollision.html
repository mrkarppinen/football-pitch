<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Football Pitch - Collision Test</title>
 <style>
  * {
   box-sizing: border-box;
  }

  body {
   margin: 0;
   min-height: 100vh;
   display: grid;
   place-items: center;
   background: #183f12;
   color: #f7f8ef;
   font: 14px Arial, sans-serif;
  }

  main {
   width: min(100%, 1200px);
  }

  .pitch-container {
   width: min(100%, 1200px);
   aspect-ratio: 105 / 68;
  }

  #match-status {
   min-height: 1.25em;
   padding: 10px 12px;
   text-align: center;
  }

  canvas {
   display: block;
   width: 100%;
   height: 100%;
   touch-action: none;
  }
 </style>
</head>
<body>
 <main>
  <div class="pitch-container">
   <canvas id="pitch" aria-label="Football collision test"></canvas>
  </div>
  <div id="match-status" role="status" aria-live="polite"></div>
 </main>

 <script src="./ballPossession.bundle.js"></script>
</body>
</html>
